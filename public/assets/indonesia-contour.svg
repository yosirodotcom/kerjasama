<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" fill="none">
  <!-- Soft Water Gradient Background -->
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="350" rx="16" fill="url(#oceanGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="175" x2="800" y2="175" stroke="#BAE6FD" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="200" y1="0" x2="200" y2="350" stroke="#BAE6FD" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="0" x2="400" y2="350" stroke="#BAE6FD" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="600" y1="0" x2="600" y2="350" stroke="#BAE6FD" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Simplified Indonesian Archipelago Paths -->
  <!-- Sumatra -->
  <path d="M 60 70 L 100 120 L 140 180 L 170 230 L 160 250 L 130 210 L 90 140 L 50 80 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="0.95"/>
  <!-- Java -->
  <path d="M 180 260 L 250 265 L 320 270 L 350 272 L 340 282 L 270 280 L 190 275 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="0.95"/>
  <!-- Kalimantan (POLNEP Pontianak base) -->
  <path d="M 230 110 L 290 100 L 330 130 L 320 190 L 270 200 L 220 180 L 210 140 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" opacity="0.98"/>
  <!-- Sulawesi -->
  <path d="M 370 120 L 410 110 L 400 150 L 430 170 L 410 210 L 390 180 L 370 170 L 380 140 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="0.95"/>
  <!-- Papua -->
  <path d="M 540 160 L 600 140 L 680 150 L 720 180 L 710 220 L 650 240 L 580 220 L 550 180 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="0.95"/>
  <!-- Maluku & Nusa Tenggara -->
  <circle cx="470" cy="180" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="490" cy="200" r="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="380" cy="280" r="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="430" cy="285" r="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>

  <!-- Hotspots & Markers -->
  <!-- Pontianak / West Kalimantan (HQ) -->
  <circle cx="225" cy="148" r="14" fill="#0284C7" fill-opacity="0.2" filter="url(#glow)">
    <animate attributeName="r" values="10;18;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="225" cy="148" r="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="225" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#0369A1">POLNEP</text>

  <!-- Jakarta Hub -->
  <circle cx="215" cy="265" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Surabaya Hub -->
  <circle cx="310" cy="272" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Makassar Hub -->
  <circle cx="395" cy="195" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Jayapura Hub -->
  <circle cx="700" cy="170" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
